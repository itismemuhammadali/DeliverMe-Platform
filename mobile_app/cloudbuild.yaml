steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/deliver-mee-frontend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/deliver-mee-frontend:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/deliver-mee-frontend:$SHORT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - 'run'
      - '--filename=.'
      - '--image=gcr.io/$PROJECT_ID/deliver-mee-frontend:$SHORT_SHA'
      - '--location=us-central1'
      - '--output=/workspace/output'

  # Deploy to Cloud Run using gcloud
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'deliver-mee-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/deliver-mee-frontend:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/deliver-mee-frontend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/deliver-mee-frontend:latest'

substitutions:
  _REGION: 'us-central1'

options:
  machineType: 'N1_HIGHCPU_8'

timeout: '1800s'
